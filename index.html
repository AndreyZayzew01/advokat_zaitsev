    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        const loading = document.getElementById("__bundler_loading");
        function setStatus(msg) {
          if (loading) loading.textContent = msg;
        }

        const FONT_MIME =
          /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
        const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
        function toBase64(bytes) {
          let bin = "";
          for (let i = 0; i < bytes.length; i += 0x8000) {
            bin += String.fromCharCode.apply(
              null,
              bytes.subarray(i, i + 0x8000),
            );
          }
          return btoa(bin);
        }

        // Error sink persists across replaceWith since it's on window, not the DOM.
        window.addEventListener(
          "error",
          function (e) {
            var p = document.body || document.documentElement;
            var d =
              document.getElementById("__bundler_err") ||
              p.appendChild(document.createElement("div"));
            d.id = "__bundler_err";
            d.style.cssText =
              "position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto";
            d.textContent =
              (d.textContent ? d.textContent + String.fromCharCode(10) : "") +
              "[bundle] " +
              (e.message || e.type) +
              (e.filename
                ? " (" + e.filename.slice(0, 60) + ":" + e.lineno + ")"
                : "");
          },
          true,
        );

        try {
          const manifestEl = document.querySelector(
            'script[type="__bundler/manifest"]',
          );
          const templateEl = document.querySelector(
            'script[type="__bundler/template"]',
          );
          if (!manifestEl || !templateEl) {
            setStatus("Error: missing bundle data");
            console.error(
              "[bundler] Missing script tags — manifestEl:",
              !!manifestEl,
              "templateEl:",
              !!templateEl,
            );
            return;
          }

          const manifest = JSON.parse(manifestEl.textContent);
          let template = JSON.parse(templateEl.textContent);

          const uuids = Object.keys(manifest);
          setStatus("Unpacking " + uuids.length + " assets...");

          const blobUrls = {};
          await Promise.all(
            uuids.map(async (uuid) => {
              const entry = manifest[uuid];
              try {
                const binaryStr = atob(entry.data);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++)
                  bytes[i] = binaryStr.charCodeAt(i);

                let finalBytes = bytes;
                if (entry.compressed) {
                  if (typeof DecompressionStream !== "undefined") {
                    const ds = new DecompressionStream("gzip");
                    const writer = ds.writable.getWriter();
                    const reader = ds.readable.getReader();
                    writer.write(bytes);
                    writer.close();
                    const chunks = [];
                    let totalLen = 0;
                    while (true) {
                      const { done, value } = await reader.read();
                      if (done) break;
                      chunks.push(value);
                      totalLen += value.length;
                    }
                    finalBytes = new Uint8Array(totalLen);
                    let offset = 0;
                    for (const chunk of chunks) {
                      finalBytes.set(chunk, offset);
                      offset += chunk.length;
                    }
                  } else {
                    console.warn(
                      "DecompressionStream not available, asset " +
                        uuid +
                        " may not render",
                    );
                  }
                }

                if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
                  // Strict artifact hosts allow font-src data: but not blob:.
                  blobUrls[uuid] =
                    "data:" +
                    entry.mime +
                    ";base64," +
                    (entry.compressed ? toBase64(finalBytes) : entry.data);
                } else {
                  blobUrls[uuid] = URL.createObjectURL(
                    new Blob([finalBytes], { type: entry.mime }),
                  );
                }
              } catch (err) {
                console.error("Failed to decode asset " + uuid + ":", err);
                blobUrls[uuid] = URL.createObjectURL(
                  new Blob([], { type: entry.mime }),
                );
              }
            }),
          );

          const extResEl = document.querySelector(
            'script[type="__bundler/ext_resources"]',
          );
          const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
          const resourceMap = {};
          for (const entry of extResources) {
            if (blobUrls[entry.uuid])
              resourceMap[entry.id] = blobUrls[entry.uuid];
          }

          setStatus("Rendering...");
          for (const uuid of uuids)
            template = template.split(uuid).join(blobUrls[uuid]);

          // Strip integrity + crossorigin — blob URLs from a file:// document inherit
          // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
          // The manifest bytes are ours; SRI protects against CDN compromise, not this.
          template = template
            .replace(/\s+integrity="[^"]*"/gi, "")
            .replace(/\s+crossorigin="[^"]*"/gi, "");

          const resourceScript =
            "<script>window.__resources = " +
            JSON.stringify(resourceMap)
              .split("</" + "script>")
              .join("<\\/" + "script>") +
            ";</" +
            "script>";
          // Inject after <head> so the DOCTYPE stays first; prepending the script
          // would push the parser into quirks mode. DOMParser always emits a <head>
          // (synthesizing one if the source HTML omitted it) but may carry
          // attributes through, so match the full opening tag. slice() rather than
          // replace() keeps us clear of $-pattern substitution in resourceScript.
          const headOpen = template.match(/<head[^>]*>/i);
          if (headOpen) {
            const i = headOpen.index + headOpen[0].length;
            template =
              template.slice(0, i) + resourceScript + template.slice(i);
          }

          // Parse the template and swap the root element. Scripts inserted via
          // DOMParser/replaceWith are inert per spec — re-create each with
          // createElement so they execute, awaiting onload for src scripts to
          // preserve ordering (React before ReactDOM before Babel before text/babel).
          const doc = new DOMParser().parseFromString(template, "text/html");
          document.documentElement.replaceWith(doc.documentElement);
          const dead = Array.from(document.scripts);
          for (const old of dead) {
            const s = document.createElement("script");
            for (const a of old.attributes) s.setAttribute(a.name, a.value);
            s.textContent = old.textContent;
            // text/babel scripts with a src: fetch and inline. transformScriptTags
            // does XHR against the src, but blob:null/ from a file:// origin is
            // silently dropped. Inlining makes it a plain inline babel script,
            // which transformScriptTags handles unconditionally.
            if ((s.type === "text/babel" || s.type === "text/jsx") && s.src) {
              const r = await fetch(s.src);
              s.textContent = await r.text();
              s.removeAttribute("src");
            }
            const p = s.src
              ? new Promise(function (r) {
                  s.onload = s.onerror = r;
                })
              : null;
            old.replaceWith(s);
            if (p) await p;
          }
          // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
          // which fired before we swapped the document. Trigger manually if present.
          if (
            window.Babel &&
            typeof window.Babel.transformScriptTags === "function"
          ) {
            window.Babel.transformScriptTags();
          }
        } catch (err) {
          setStatus("Error unpacking: " + err.message);
          console.error("Bundle unpack error:", err);
        }
      });
    </script>

rcase\">{{ c.role }} · Хакасия</span>\n      </span>\n    </a>\n    <sc-if value=\"{{ isDesktop }}\" hint-placeholder-val=\"{{ true }}\">\n      <nav aria-label=\"Основная навигация\" style=\"display:flex;align-items:center;gap:24px\">\n        <sc-for list=\"{{ nav }}\" as=\"item\" hint-placeholder-count=\"7\">\n          <a href=\"{{ item.href }}\" style=\"color:#c7cfda;font:500 14px 'Manrope',sans-serif\" style-hover=\"color:#ffffff\">{{ item.label }}</a>\n        </sc-for>\n      </nav>\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <a href=\"tel:{{ c.phoneHref }}\" style=\"color:#f4f1ea;font:600 14px 'Manrope',sans-serif;white-space:nowrap\">{{ c.phoneDisplay }}</a>\n        <a href=\"#form\" style=\"padding:11px 18px;border-radius:9px;background:#bd9a5c;color:#161d27;font:600 14px 'Manrope',sans-serif;white-space:nowrap\" style-hover=\"background:#caa869\">Записаться</a>\n      </div>\n    </sc-if>\n    <sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;align-items:center;gap:10px\">\n        <a href=\"tel:{{ c.phoneHref }}\" aria-label=\"Позвонить адвокату\" style=\"width:42px;height:42px;border-radius:9px;border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;color:#f4f1ea;font:600 12px 'Manrope',sans-serif\">Тел</a>\n        <button type=\"button\" aria-label=\"Открыть меню\" aria-expanded=\"{{ menuOpen }}\" onclick=\"{{ toggleMenu }}\" style=\"width:42px;height:42px;border-radius:9px;border:1px solid rgba(255,255,255,.22);background:transparent;display:grid;place-items:center;cursor:pointer\">\n          <span style=\"display:block;width:18px;height:2px;background:#f4f1ea;box-shadow:0 6px 0 #f4f1ea,0 -6px 0 #f4f1ea\"></span>\n        </button>\n      </div>\n    </sc-if>\n  </div>\n</header>\n\n<sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div role=\"dialog\" aria-modal=\"true\" aria-label=\"Меню\" onclick=\"{{ closeMenu }}\" style=\"position:fixed;inset:0;z-index:80;background:rgba(9,12,18,.62)\">\n    <nav onclick=\"{{ stop }}\" style=\"position:absolute;top:0;right:0;height:100%;width:min(86vw,340px);background:#141c27;padding:20px 22px 32px;display:flex;flex-direction:column;gap:4px;box-shadow:-24px 0 60px rgba(0,0,0,.45);overflow-y:auto\">\n      <button type=\"button\" aria-label=\"Закрыть меню\" onclick=\"{{ closeMenu }}\" style=\"align-self:flex-end;width:40px;height:40px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#f4f1ea;font-size:20px;cursor:pointer;margin-bottom:8px\">✕</button>\n      <sc-for list=\"{{ nav }}\" as=\"item\" hint-placeholder-count=\"7\">\n        <a href=\"{{ item.href }}\" onclick=\"{{ closeMenu }}\" style=\"padding:14px 6px;border-bottom:1px solid rgba(255,255,255,.07);color:#e7ebf1;font:500 16px 'Manrope',sans-serif\">{{ item.label }}</a>\n      </sc-for>\n      <a href=\"#form\" onclick=\"{{ closeMenu }}\" style=\"margin-top:18px;text-align:center;padding:14px;border-radius:10px;background:#bd9a5c;color:#161d27;font:600 15px 'Manrope',sans-serif\">Записаться на консультацию</a>\n      <a href=\"{{ c.tgUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"margin-top:8px;text-align:center;padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,.24);color:#f4f1ea;font:600 15px 'Manrope',sans-serif\">Написать в Telegram</a>\n    </nav>\n  </div>\n</sc-if>\n\n<main>\n  <!-- ================= ПЕРВЫЙ ЭКРАН ================= -->\n  <section style=\"background:#111925;color:#eef1f5;padding:clamp(46px,7vw,88px) 22px clamp(52px,8vw,96px)\">\n    <div style=\"max-width:1160px;margin:0 auto;display:flex;flex-wrap:wrap;gap:clamp(30px,5vw,60px);align-items:center\">\n      <div style=\"flex:1 1 460px;min-width:min(100%,460px)\">\n        <div style=\"display:flex;align-items:center;gap:10px\">\n          <span style=\"width:26px;height:1px;background:#c8a763\"></span>\n          <span style=\"font:600 12px 'Manrope',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#c8a763\">Адвокат · Республика Хакасия</span>\n        </div>\n        <h1 style=\"font:600 clamp(31px,5.2vw,52px)/1.08 'Lora',serif;letter-spacing:-.01em;color:#fbfaf7;margin:18px 0 0\">Адвокатская помощь в&nbsp;Республике Хакасия</h1>\n        <p style=\"font:400 clamp(16px,2vw,19px)/1.6 'Manrope',sans-serif;color:#b4bfcc;margin:18px 0 0;max-width:560px\">Консультации и представительство по&nbsp;уголовным, семейным, наследственным и&nbsp;гражданским делам. Работаю очно в&nbsp;Абакане и&nbsp;дистанционно по&nbsp;всей республике.</p>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:22px\">\n          <span style=\"padding:7px 14px;border:1px solid rgba(255,255,255,.16);border-radius:999px;font:500 13px 'Manrope',sans-serif;color:#d7dde5\">Опыт практики</span>\n          <span style=\"padding:7px 14px;border:1px solid rgba(255,255,255,.16);border-radius:999px;font:500 13px 'Manrope',sans-serif;color:#d7dde5\">Конфиденциальность</span>\n          <span style=\"padding:7px 14px;border:1px solid rgba(255,255,255,.16);border-radius:999px;font:500 13px 'Manrope',sans-serif;color:#d7dde5\">Индивидуальный подход</span>\n        </div>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:28px\">\n          <a href=\"#form\" style=\"padding:15px 24px;border-radius:10px;background:#bd9a5c;color:#161d27;font:600 15px 'Manrope',sans-serif\" style-hover=\"background:#caa869\">Записаться на консультацию</a>\n          <a href=\"tel:{{ c.phoneHref }}\" style=\"padding:15px 22px;border-radius:10px;border:1px solid rgba(255,255,255,.26);color:#f4f1ea;font:600 15px 'Manrope',sans-serif\" style-hover=\"border-color:#c8a763;color:#ffffff\">Позвонить</a>\n          <a href=\"{{ c.tgUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"padding:15px 22px;border-radius:10px;border:1px solid rgba(255,255,255,.26);color:#f4f1ea;font:600 15px 'Manrope',sans-serif\" style-hover=\"border-color:#c8a763;color:#ffffff\">Написать в Telegram</a>\n        </div>\n        <p style=\"font:500 13px 'Manrope',sans-serif;color:#8b97a6;margin:22px 0 0\">Абакан · Черногорск · Саяногорск · Абаза · Сорск и другие районы Хакасии</p>\n      </div>\n      <sc-if value=\"{{ heroPhoto }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"flex:1 1 340px;min-width:min(100%,320px);display:flex;justify-content:center\">\n          <div style=\"position:relative;width:min(100%,410px)\">\n            <!-- ЗАМЕНИТЬ: профессиональное фото адвоката (портрет ~4:5) -->\n            <img src=\"advokat-zaitsev-photo\" alt=\"Адвокат Зайцев Валерий Олегович\" style=\"display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center top;border-radius:16px;border:1px solid rgba(189,154,92,.5);box-shadow:0 30px 64px rgba(0,0,0,.4)\">\n            <div style=\"position:absolute;left:16px;bottom:16px;background:#fff;border-radius:12px;padding:12px 16px;box-shadow:0 18px 40px rgba(0,0,0,.32);display:flex;flex-direction:column;gap:2px\">\n              <span style=\"font:600 13px 'Manrope',sans-serif;color:#1c2430\">Стаж практики — более 15 лет</span>\n              <span style=\"font:500 12px 'Manrope',sans-serif;color:#8a6d3b\">Действующий адвокат</span>\n            </div>\n          </div>\n        </div>\n      </sc-if>\n    </div>\n  </section>\n\n  <!-- ================= БЛОК ДОВЕРИЯ ================= -->\n  <section id=\"trust\" style=\"background:#f4efe6;padding:clamp(54px,8vw,96px) 22px;scroll-margin-top:74px\">\n    <div style=\"max-width:1160px;margin:0 auto\">\n      <div style=\"max-width:660px;margin:0 0 clamp(28px,4vw,44px)\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:26px;height:1px;background:#bd9a5c\"></span><span style=\"font:600 12px 'Manrope',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#a9803f\">Почему можно доверять</span></div>\n        <h2 style=\"font:600 clamp(26px,3.6vw,40px)/1.14 'Lora',serif;letter-spacing:-.01em;color:#1c2430;margin:14px 0 0\">Спокойная и профессиональная защита ваших интересов</h2>\n        <p style=\"font:400 clamp(15px,1.8vw,17px)/1.6 'Manrope',sans-serif;color:#5a6472;margin:14px 0 0\">Работаю в рамках закона и адвокатской этики, соблюдаю конфиденциальность и подхожу к каждому делу индивидуально.</p>\n      </div>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px\">\n        <sc-for list=\"{{ trust }}\" as=\"item\" hint-placeholder-count=\"7\">\n          <div style=\"background:#fff;border:1px solid rgba(23,33,46,.09);border-radius:14px;padding:24px\" style-hover=\"border-color:rgba(189,154,92,.55)\">\n            <div style=\"width:34px;height:34px;border-radius:8px;background:rgba(189,154,92,.15);display:grid;place-items:center;margin-bottom:14px\"><span style=\"width:9px;height:9px;background:#bd9a5c;border-radius:2px;transform:rotate(45deg)\"></span></div>\n            <h3 style=\"font:600 17px 'Manrope',sans-serif;color:#1c2430;margin:0 0 6px\">{{ item.t }}</h3>\n            <p style=\"font:400 14px/1.55 'Manrope',sans-serif;color:#5a6472;margin:0\">{{ item.d }}</p>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n  </section>\n\n  <!-- ================= НАПРАВЛЕНИЯ ПОМОЩИ ================= -->\n  <section id=\"services\" style=\"background:#fdfbf7;padding:clamp(54px,8vw,96px) 22px;scroll-margin-top:74px\">\n    <div style=\"max-width:1160px;margin:0 auto\">\n      <div style=\"max-width:660px;margin:0 0 clamp(28px,4vw,44px)\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:26px;height:1px;background:#bd9a5c\"></span><span style=\"font:600 12px 'Manrope',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#a9803f\">Направления помощи</span></div>\n        <h2 style=\"font:600 clamp(26px,3.6vw,40px)/1.14 'Lora',serif;letter-spacing:-.01em;color:#1c2430;margin:14px 0 0\">По каким вопросам можно обратиться</h2>\n        <p style=\"font:400 clamp(15px,1.8vw,17px)/1.6 'Manrope',sans-serif;color:#5a6472;margin:14px 0 0\">Ведение дел на всех стадиях — от консультации и подготовки документов до представительства в суде.</p>\n      </div>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:16px\">\n        <sc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"10\">\n          <a href=\"#form\" style=\"display:block;background:#fff;border:1px solid rgba(23,33,46,.09);border-radius:14px;padding:24px\" style-hover=\"border-color:rgba(189,154,92,.6)\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center\">\n              <span style=\"font:600 13px ui-monospace,Menlo,monospace;color:#bd9a5c;letter-spacing:.04em\">{{ s.n }}</span>\n              <span style=\"color:#bd9a5c;font-size:17px\">→</span>\n            </div>\n            <h3 style=\"font:600 19px/1.25 'Lora',serif;color:#1c2430;margin:16px 0 8px\">{{ s.title }}</h3>\n            <p style=\"font:400 14px/1.55 'Manrope',sans-serif;color:#5a6472;margin:0 0 16px\">{{ s.desc }}</p>\n            <span style=\"font:600 13px 'Manrope',sans-serif;color:#8a6d3b\">Получить консультацию →</span>\n          </a>\n        </sc-for>\n      </div>\n    </div>\n  </section>\n\n  <!-- ================= С КАКИМИ СИТУАЦИЯМИ ================= -->\n  <section id=\"situations\" style=\"background:#111925;color:#eef1f5;padding:clamp(54px,8vw,96px) 22px;scroll-margin-top:74px\">\n    <div style=\"max-width:1160px;margin:0 auto\">\n      <div style=\"max-width:680px;margin:0 0 clamp(28px,4vw,44px)\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:26px;height:1px;background:#c8a763\"></span><span style=\"font:600 12px 'Manrope',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#c8a763\">Ваша ситуация</span></div>\n        <h2 style=\"font:600 clamp(26px,3.6vw,40px)/1.14 'Lora',serif;letter-spacing:-.01em;color:#fbfaf7;margin:14px 0 0\">С какими ситуациями можно обратиться</h2>\n        <p style=\"font:400 clamp(15px,1.8vw,17px)/1.6 'Manrope',sans-serif;color:#aab6c3;margin:14px 0 0\">Если вы узнали свою ситуацию — не откладывайте. На раннем этапе помочь обычно проще.</p>\n      </div>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px\">\n        <sc-for list=\"{{ situations }}\" as=\"x\" hint-placeholder-count=\"10\">\n          <div style=\"display:flex;gap:14px;padding:18px 18px;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:rgba(255,255,255,.025)\">\n            <span style=\"flex:none;margin-top:5px;width:9px;height:9px;background:#c8a763;border-radius:2px;transform:rotate(45deg)\"></span>\n            <div>\n              <h3 style=\"font:600 16px 'Manrope',sans-serif;color:#f4f1ea;margin:0 0 4px\">{{ x.t }}</h3>\n              <p style=\"font:400 13.5px/1.5 'Manrope',sans-serif;color:#a6b1bf;margin:0\">{{ x.d }}</p>\n            </div>\n          </div>\n        </sc-for>\n      </div>\n      <div style=\"margin-top:34px;display:flex;flex-wrap:wrap;align-items:center;gap:16px\">\n        <p style=\"font:500 15px 'Manrope',sans-serif;color:#d7dde5;margin:0\">Не нашли свою ситуацию? Опишите её — подскажу возможные варианты действий.</p>\n        <a href=\"#form\" style=\"padding:13px 22px;border-radius:10px;background:#bd9a5c;color:#161d27;font:600 14px 'Manrope',sans-serif\" style-hover=\"background:#caa869\">Описать ситуацию</a>\n      </div>\n    </div>\n  </section>\n\n  <!-- ================= КАК ПРОХОДИТ КОНСУЛЬТАЦИЯ ================= -->\n  <section id=\"process\" style=\"background:#f4efe6;padding:clamp(54px,8vw,96px) 22px;scroll-margin-top:74px\">\n    <div style=\"max-width:1160px;margin:0 auto\">\n      <div style=\"max-width:660px;margin:0 0 clamp(28px,4vw,44px)\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:26px;height:1px;background:#bd9a5c\"></span><span style=\"font:600 12px 'Manrope',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#a9803f\">Как это работает</span></div>\n        <h2 style=\"font:600 clamp(26px,3.6vw,40px)/1.14 'Lora',serif;letter-spacing:-.01em;color:#1c2430;margin:14px 0 0\">Как проходит консультация</h2>\n        <p style=\"font:400 clamp(15px,1.8vw,17px)/1.6 'Manrope',sans-serif;color:#5a6472;margin:14px 0 0\">Понятный порядок обращения — без лишнего стресса и формальностей.</p>\n      </div>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px\">\n        <sc-for list=\"{{ steps }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <div style=\"background:#fff;border:1px solid rgba(23,33,46,.09);border-radius:14px;padding:24px\">\n            <span style=\"display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid rgba(189,154,92,.55);color:#a9803f;font:600 16px 'Lora',serif;margin-bottom:14px\">{{ p.n }}</span>\n            <h3 style=\"font:600 17px 'Manrope',sans-serif;color:#1c2430;margin:0 0 6px\">{{ p.t }}</h3>\n            <p style=\"font:400 14px/1.55 'Manrope',sans-serif;color:#5a6472;margin:0\">{{ p.d }}</p>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n  </section>\n\n  <!-- ================= ФОРМАТЫ КОНСУЛЬТАЦИЙ ================= -->\n  <section id=\"formats\" style=\"background:#fdfbf7;padding:clamp(54px,8vw,96px) 22px;scroll-margin-top:74px\">\n    <div style=\"max-width:1160px;margin:0 auto\">\n      <div style=\"max-width:660px;margin:0 0 clamp(24px,3vw,36px)\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:26px;height:1px;background:#bd9a5c\"></span><span style=\"font:600 12px 'Manrope',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#a9803f\">Форматы консультаций</span></div>\n        <h2 style=\"font:600 clamp(26px,3.6vw,40px)/1.14 'Lora',serif;letter-spacing:-.01em;color:#1c2430;margin:14px 0 0\">Выберите удобный способ</h2>\n      </div>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px\">\n        <sc-for list=\"{{ formats }}\" as=\"f\" hint-placeholder-count=\"5\">\n          <div style=\"background:#fff;border:1px solid rgba(23,33,46,.09);border-radius:12px;padding:20px\">\n            <h3 style=\"font:600 16px 'Manrope',sans-serif;color:#1c2430;margin:0 0 6px\">{{ f.t }}</h3>\n            <p style=\"font:400 13.5px/1.5 'Manrope',sans-serif;color:#5a6472;margin:0\">{{ f.d }}</p>\n          </div>\n        </sc-for>\n      </div>\n      <div style=\"margin-top:20px;display:flex;gap:14px;align-items:flex-start;background:rgba(189,154,92,.1);border:1px solid rgba(189,154,92,.3);border-radius:12px;padding:18px 20px\">\n        <span style=\"flex:none;margin-top:4px;width:9px;height:9px;background:#bd9a5c;border-radius:2px;transform:rotate(45deg)\"></span>\n        <p style=\"font:500 15px/1.55 'Manrope',sans-serif;color:#4a4133;margin:0\">Если вы находитесь не в Абакане, консультацию можно провести дистанционно — по телефону, в Telegram или по видеосвязи.</p>\n      </div>\n    </div>\n  </section>\n\n  <!-- ================= ГЕОГРАФИЯ РАБОТЫ ================= -->\n  <section id=\"geo\" style=\"background:#111925;color:#eef1f5;padding:clamp(54px,8vw,96px) 22px;scroll-margin-top:74px\">\n    <div style=\"max-width:1160px;margin:0 auto;display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,56px);align-items:center\">\n      <div style=\"flex:1 1 380px;min-width:min(100%,340px)\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:26px;height:1px;background:#c8a763\"></span><span style=\"font:600 12px 'Manrope',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#c8a763\">География работы</span></div>\n        <h2 style=\"font:600 clamp(26px,3.6vw,38px)/1.14 'Lora',serif;letter-spacing:-.01em;color:#fbfaf7;margin:14px 0 0\">Работаю по всей Республике Хакасия</h2>\n        <p style=\"font:400 clamp(15px,1.8vw,17px)/1.6 'Manrope',sans-serif;color:#aab6c3;margin:14px 0 18px\">Принимаю доверителей очно в Абакане, а также провожу дистанционные консультации для жителей других городов и районов республики.</p>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n          <sc-for list=\"{{ cities }}\" as=\"city\" hint-placeholder-count=\"10\">\n            <span style=\"padding:8px 14px;border:1px solid rgba(255,255,255,.16);border-radius:999px;font:500 13.5px 'Manrope',sans-serif;color:#d7dde5\">{{ city }}</span>\n          </sc-for>\n        </div>\n      </div>\n      <div style=\"flex:1 1 320px;min-width:min(100%,300px)\">\n        <div role=\"img\" aria-label=\"Республика Хакасия — регион работы\" style=\"aspect-ratio:4/3;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:repeating-linear-gradient(135deg,#1b2532 0,#1b2532 12px,#212d3c 12px,#212d3c 24px);display:grid;place-items:center\">\n          <span style=\"font:500 12px/1.6 ui-monospace,Menlo,monospace;color:#8fa0b4;text-align:center;padding:0 20px\">Республика Хакасия<br>(место для карты региона)</span>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <!-- ================= О СПЕЦИАЛИСТЕ / ОБРАЗОВАНИЕ ================= -->\n  <section id=\"about\" style=\"background:#f4efe6;padding:clamp(54px,8vw,96px) 22px;scroll-margin-top:74px\">\n    <div style=\"max-width:1160px;margin:0 auto;display:flex;flex-wrap:wrap;gap:clamp(30px,5vw,60px)\">\n      <div style=\"flex:1 1 320px;min-width:min(100%,300px)\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:26px;height:1px;background:#bd9a5c\"></span><span style=\"font:600 12px 'Manrope',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#a9803f\">О специалисте</span></div>\n        <h2 style=\"font:600 clamp(26px,3.6vw,38px)/1.14 'Lora',serif;letter-spacing:-.01em;color:#1c2430;margin:14px 0 16px\">Образование и карьера</h2>\n        <!-- ЗАМЕНИТЬ: фото в рабочей обстановке -->\n        <div role=\"img\" aria-label=\"Фото адвоката в рабочей обстановке\" style=\"aspect-ratio:3/4;max-width:340px;border-radius:16px;border:1px solid rgba(23,33,46,.1);background:repeating-linear-gradient(135deg,#e9e2d5 0,#e9e2d5 11px,#efe9dd 11px,#efe9dd 22px);display:grid;place-items:center\">\n          <span style=\"font:500 12px/1.7 ui-monospace,Menlo,monospace;color:#9a8f7d;text-align:center;padding:0 20px\">ЗАМЕНИТЬ<br>фото в рабочей<br>обстановке</span>\n        </div>\n        <p style=\"font:400 14px/1.6 'Manrope',sans-serif;color:#5a6472;margin:18px 0 0;max-width:340px\">Помогаю доверителям спокойно и по существу: объясняю варианты действий, риски и порядок работы понятным языком.</p>\n      </div>\n      <div style=\"flex:1 1 420px;min-width:min(100%,320px)\">\n        <sc-for list=\"{{ timeline }}\" as=\"it\" hint-placeholder-count=\"5\">\n          <div style=\"position:relative;padding-left:26px;padding-bottom:26px;border-left:1px solid rgba(189,154,92,.35);margin-left:6px\">\n            <span style=\"position:absolute;left:-5px;top:3px;width:10px;height:10px;border-radius:50%;background:#bd9a5c\"></span>\n            <span style=\"font:600 11px 'Manrope',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#a9803f\">{{ it.y }}</span>\n            <h3 style=\"font:600 18px 'Manrope',sans-serif;color:#1c2430;margin:5px 0 5px\">{{ it.t }}</h3>\n            <p style=\"font:400 14px/1.55 'Manrope',sans-serif;color:#5a6472;margin:0\">{{ it.d }}</p>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n  </section>\n\n  <!-- ================= ДОКУМЕНТЫ И СЕРТИФИКАТЫ ================= -->\n  <section id=\"docs\" style=\"background:#fdfbf7;padding:clamp(54px,8vw,96px) 22px;scroll-margin-top:74px\">\n    <div style=\"max-width:1160px;margin:0 auto\">\n      <div style=\"max-width:660px;margin:0 0 clamp(28px,4vw,44px)\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:26px;height:1px;background:#bd9a5c\"></span><span style=\"font:600 12px 'Manrope',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#a9803f\">Документы</span></div>\n        <h2 style=\"font:600 clamp(26px,3.6vw,40px)/1.14 'Lora',serif;letter-spacing:-.01em;color:#1c2430;margin:14px 0 0\">Сертификаты и удостоверения</h2>\n        <p style=\"font:400 clamp(15px,1.8vw,17px)/1.6 'Manrope',sans-serif;color:#5a6472;margin:14px 0 0\">Нажмите на документ, чтобы рассмотреть его подробнее.</p>\n      </div>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px\">\n        <sc-for list=\"{{ certs }}\" as=\"ct\" hint-placeholder-count=\"6\">\n          <button type=\"button\" onclick=\"{{ ct.open }}\" style=\"text-align:left;background:#fff;border:1px solid rgba(23,33,46,.09);border-radius:12px;padding:12px;cursor:pointer\" style-hover=\"border-color:rgba(189,154,92,.6)\">\n            <!-- ЗАМЕНИТЬ: изображение документа (заменить полосатый placeholder на <img>) -->\n            <div style=\"aspect-ratio:3/4;border-radius:8px;background:repeating-linear-gradient(135deg,#ece5d8 0,#ece5d8 10px,#f2ece1 10px,#f2ece1 20px);display:grid;place-items:center\"><span style=\"font:500 11px ui-monospace,Menlo,monospace;color:#9a8f7d\">документ</span></div>\n            <span style=\"display:block;font:600 13.5px 'Manrope',sans-serif;color:#1c2430;margin:12px 0 3px\">{{ ct.cap }}</span>\n            <span style=\"font:600 12px 'Manrope',sans-serif;color:#8a6d3b\">Открыть →</span>\n          </button>\n        </sc-for>\n      </div>\n    </div>\n  </section>\n\n  <!-- ================= ОТЗЫВЫ ================= -->\n  <sc-if value=\"{{ showReviews }}\" hint-placeholder-val=\"{{ true }}\">\n  <section id=\"reviews\" style=\"background:#f4efe6;padding:clamp(54px,8vw,96px) 22px;scroll-margin-top:74px\">\n    <div style=\"max-width:1160px;margin:0 auto\">\n      <div style=\"max-width:660px;margin:0 0 clamp(28px,4vw,44px)\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:26px;height:1px;background:#bd9a5c\"></span><span style=\"font:600 12px 'Manrope',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#a9803f\">Отзывы</span></div>\n        <h2 style=\"font:600 clamp(26px,3.6vw,40px)/1.14 'Lora',serif;letter-spacing:-.01em;color:#1c2430;margin:14px 0 0\">Что говорят доверители</h2>\n        <p style=\"font:400 clamp(15px,1.8vw,17px)/1.6 'Manrope',sans-serif;color:#5a6472;margin:14px 0 0\">Отзывы публикуются с согласия доверителей. Имена изменены для сохранения конфиденциальности.</p>\n      </div>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px\">\n        <sc-for list=\"{{ reviews }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div style=\"background:#fff;border:1px solid rgba(23,33,46,.09);border-radius:14px;padding:26px 24px;display:flex;flex-direction:column;gap:12px\">\n            <span style=\"font:600 44px 'Lora',serif;color:#dcc79f;height:22px;line-height:1\">“</span>\n            <p style=\"font:400 15px/1.6 'Manrope',sans-serif;color:#3a4553;margin:0\">{{ r.text }}</p>\n            <div style=\"margin-top:auto;padding-top:8px\">\n              <div style=\"font:600 14px 'Manrope',sans-serif;color:#1c2430\">{{ r.cat }}</div>\n              <div style=\"font:500 12px 'Manrope',sans-serif;color:#8a939f\">{{ r.note }}</div>\n            </div>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n  </section>\n  </sc-if>\n\n  <!-- ================= ПРИМЕРЫ КАТЕГОРИЙ ДЕЛ ================= -->\n  <section id=\"cases\" style=\"background:#111925;color:#eef1f5;padding:clamp(50px,7vw,86px) 22px;scroll-margin-top:74px\">\n    <div style=\"max-width:900px;margin:0 auto;text-align:center\">\n      <div style=\"display:inline-flex;align-items:center;gap:10px;margin-bottom:14px\"><span style=\"width:26px;height:1px;background:#c8a763\"></span><span style=\"font:600 12px 'Manrope',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#c8a763\">Опыт</span><span style=\"width:26px;height:1px;background:#c8a763\"></span></div>\n      <h2 style=\"font:600 clamp(24px,3.4vw,36px)/1.16 'Lora',serif;letter-spacing:-.01em;color:#fbfaf7;margin:0\">Примеры категорий дел</h2>\n      <p style=\"font:400 clamp(15px,1.8vw,17px)/1.6 'Manrope',sans-serif;color:#aab6c3;margin:16px 0 22px\">В практике встречались дела, связанные с наследственными спорами, разделом имущества, защитой по уголовным делам, взысканием задолженности, спорами по недвижимости и семейными конфликтами.</p>\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:8px\">\n        <sc-for list=\"{{ categories }}\" as=\"cat\" hint-placeholder-count=\"6\">\n          <span style=\"padding:8px 15px;border:1px solid rgba(255,255,255,.16);border-radius:999px;font:500 13.5px 'Manrope',sans-serif;color:#d7dde5\">{{ cat }}</span>\n        </sc-for>\n      </div>\n      <p style=\"font:400 13px 'Manrope',sans-serif;color:#7f8b9a;margin:22px 0 0\">Информация приведена без раскрытия деталей и обстоятельств конкретных дел.</p>\n    </div>\n  </section>\n\n  <!-- ================= КОНТАКТЫ ================= -->\n  <section id=\"contacts\" style=\"background:#fdfbf7;padding:clamp(54px,8vw,96px) 22px;scroll-margin-top:74px\">\n    <div style=\"max-width:1160px;margin:0 auto;display:flex;flex-wrap:wrap;gap:clamp(28px,4vw,48px)\">\n      <div style=\"flex:1 1 360px;min-width:min(100%,320px)\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:26px;height:1px;background:#bd9a5c\"></span><span style=\"font:600 12px 'Manrope',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#a9803f\">Контакты</span></div>\n        <h2 style=\"font:600 clamp(26px,3.6vw,40px)/1.14 'Lora',serif;letter-spacing:-.01em;color:#1c2430;margin:14px 0 20px\">Как со мной связаться</h2>\n        <div style=\"display:flex;flex-direction:column;gap:2px\">\n          <a href=\"tel:{{ c.phoneHref }}\" style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 4px;border-bottom:1px solid rgba(23,33,46,.1)\"><span style=\"font:500 13px 'Manrope',sans-serif;color:#8a939f\">Телефон</span><span style=\"font:600 15px 'Manrope',sans-serif;color:#1c2430\">{{ c.phoneDisplay }}</span></a>\n          <a href=\"{{ c.tgUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 4px;border-bottom:1px solid rgba(23,33,46,.1)\"><span style=\"font:500 13px 'Manrope',sans-serif;color:#8a939f\">Telegram</span><span style=\"font:600 15px 'Manrope',sans-serif;color:#1c2430\">{{ c.tgHandle }}</span></a>\n          <a href=\"mailto:{{ c.email }}\" style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 4px;border-bottom:1px solid rgba(23,33,46,.1)\"><span style=\"font:500 13px 'Manrope',sans-serif;color:#8a939f\">Email</span><span style=\"font:600 15px 'Manrope',sans-serif;color:#1c2430\">{{ c.email }}</span></a>\n          <div style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 4px;border-bottom:1px solid rgba(23,33,46,.1)\"><span style=\"font:500 13px 'Manrope',sans-serif;color:#8a939f\">Адрес приёма</span><span style=\"font:600 15px 'Manrope',sans-serif;color:#1c2430;text-align:right\">{{ c.address }}</span></div>\n          <div style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 4px\"><span style=\"font:500 13px 'Manrope',sans-serif;color:#8a939f\">Часы приёма</span><span style=\"font:600 15px 'Manrope',sans-serif;color:#1c2430;text-align:right\">{{ c.hours }}</span></div>\n        </div>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:22px\">\n          <a href=\"tel:{{ c.phoneHref }}\" style=\"padding:13px 20px;border-radius:10px;background:#bd9a5c;color:#161d27;font:600 14px 'Manrope',sans-serif\" style-hover=\"background:#caa869\">Позвонить</a>\n          <a href=\"{{ c.tgUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"padding:13px 20px;border-radius:10px;border:1px solid rgba(23,33,46,.18);color:#1c2430;font:600 14px 'Manrope',sans-serif\" style-hover=\"border-color:#bd9a5c\">Написать в Telegram</a>\n          <a href=\"{{ c.routeUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"padding:13px 20px;border-radius:10px;border:1px solid rgba(23,33,46,.18);color:#1c2430;font:600 14px 'Manrope',sans-serif\" style-hover=\"border-color:#bd9a5c\">Построить маршрут</a>\n        </div>\n      </div>\n      <div style=\"flex:1 1 360px;min-width:min(100%,320px)\">\n        <!-- ЗАМЕНИТЬ: встроить карту (Яндекс.Карты / Google Maps iframe) -->\n        <div role=\"img\" aria-label=\"Карта — место приёма в с. Бея\" style=\"height:100%;min-height:280px;border-radius:16px;border:1px solid rgba(23,33,46,.1);background:repeating-linear-gradient(135deg,#e9e2d5 0,#e9e2d5 12px,#f1ebe0 12px,#f1ebe0 24px);display:grid;place-items:center\">\n          <span style=\"font:500 12px/1.7 ui-monospace,Menlo,monospace;color:#9a8f7d;text-align:center;padding:0 20px\">Место для карты<br>Яндекс.Карты / Google Maps</span>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <!-- ================= ФОРМА ЗАЯВКИ ================= -->\n  <section id=\"form\" style=\"background:#f4efe6;padding:clamp(54px,8vw,96px) 22px;scroll-margin-top:74px\">\n    <div style=\"max-width:1160px;margin:0 auto;display:flex;flex-wrap:wrap;gap:clamp(28px,4vw,48px)\">\n      <div style=\"flex:1 1 380px;min-width:min(100%,320px)\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:26px;height:1px;background:#bd9a5c\"></span><span style=\"font:600 12px 'Manrope',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#a9803f\">Заявка</span></div>\n        <h2 style=\"font:600 clamp(26px,3.6vw,40px)/1.14 'Lora',serif;letter-spacing:-.01em;color:#1c2430;margin:14px 0 14px\">Записаться на консультацию</h2>\n        <p style=\"font:400 15px/1.6 'Manrope',sans-serif;color:#5a6472;margin:0 0 20px\">Опишите ситуацию в общих чертах. Детали можно обсудить на консультации.</p>\n        <div style=\"display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid rgba(189,154,92,.3);border-radius:12px;padding:18px 20px\">\n          <span style=\"flex:none;margin-top:4px;width:9px;height:9px;background:#bd9a5c;border-radius:2px;transform:rotate(45deg)\"></span>\n          <div>\n            <h3 style=\"font:600 15px 'Manrope',sans-serif;color:#1c2430;margin:0 0 4px\">Конфиденциальность</h3>\n            <p style=\"font:400 13.5px/1.55 'Manrope',sans-serif;color:#5a6472;margin:0\">Все обращения, документы и обстоятельства дела рассматриваются конфиденциально. Информация не передаётся третьим лицам.</p>\n          </div>\n        </div>\n      </div>\n      <div style=\"flex:1 1 400px;min-width:min(100%,320px)\">\n        <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n          <form onsubmit=\"{{ submit }}\" style=\"background:#fff;border:1px solid rgba(23,33,46,.09);border-radius:16px;padding:clamp(22px,3vw,30px);display:flex;flex-direction:column;gap:16px\">\n            <label style=\"display:flex;flex-direction:column;gap:7px\">\n              <span style=\"font:600 13px 'Manrope',sans-serif;color:#3a4553\">Имя</span>\n              <input type=\"text\" value=\"{{ form.name }}\" onchange=\"{{ onName }}\" placeholder=\"Как к вам обращаться\" style=\"padding:13px 14px;border:1px solid rgba(23,33,46,.16);border-radius:10px;font:400 15px 'Manrope',sans-serif;color:#1c2430;background:#fdfbf7\">\n            </label>\n            <label style=\"display:flex;flex-direction:column;gap:7px\">\n              <span style=\"font:600 13px 'Manrope',sans-serif;color:#3a4553\">Телефон</span>\n              <input type=\"tel\" value=\"{{ form.phone }}\" onchange=\"{{ onPhone }}\" placeholder=\"+7 (___) ___-__-__\" style=\"padding:13px 14px;border:1px solid rgba(23,33,46,.16);border-radius:10px;font:400 15px 'Manrope',sans-serif;color:#1c2430;background:#fdfbf7\">\n            </label>\n            <label style=\"display:flex;flex-direction:column;gap:7px\">\n              <span style=\"font:600 13px 'Manrope',sans-serif;color:#3a4553\">Кратко о ситуации</span>\n              <textarea value=\"{{ form.desc }}\" onchange=\"{{ onDesc }}\" rows=\"4\" placeholder=\"В нескольких словах опишите вопрос\" style=\"padding:13px 14px;border:1px solid rgba(23,33,46,.16);border-radius:10px;font:400 15px 'Manrope',sans-serif;color:#1c2430;background:#fdfbf7;resize:vertical\"></textarea>\n            </label>\n            <label style=\"display:flex;flex-direction:column;gap:7px\">\n              <span style=\"font:600 13px 'Manrope',sans-serif;color:#3a4553\">Удобный способ связи</span>\n              <select value=\"{{ form.pref }}\" onchange=\"{{ onPref }}\" style=\"padding:13px 14px;border:1px solid rgba(23,33,46,.16);border-radius:10px;font:400 15px 'Manrope',sans-serif;color:#1c2430;background:#fdfbf7\">\n                <option>Телефон</option>\n                <option>Telegram</option>\n                <option>Email</option>\n                <option>Любой</option>\n              </select>\n            </label>\n            <label style=\"display:flex;gap:10px;align-items:flex-start;cursor:pointer\">\n              <input type=\"checkbox\" checked=\"{{ form.consent }}\" onchange=\"{{ onConsent }}\" style=\"margin-top:3px;width:18px;height:18px;accent-color:#bd9a5c;flex:none\">\n              <span style=\"font:400 12.5px/1.5 'Manrope',sans-serif;color:#5a6472\">Я согласен(а) на обработку персональных данных в соответствии с <button type=\"button\" onclick=\"{{ openPrivacy }}\" style=\"display:inline;padding:0;border:0;background:transparent;color:#8a6d3b;text-decoration:underline;font:inherit;cursor:pointer\">политикой конфиденциальности</button>.</span>\n            </label>\n            <sc-if value=\"{{ error }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font:500 13px 'Manrope',sans-serif;color:#a3402f;margin:0\">{{ error }}</p>\n            </sc-if>\n            <button type=\"submit\" style=\"padding:15px;border:none;border-radius:10px;background:#bd9a5c;color:#161d27;font:600 15px 'Manrope',sans-serif;cursor:pointer\" style-hover=\"background:#caa869\">Отправить заявку</button>\n            <p style=\"font:400 12px 'Manrope',sans-serif;color:#8a939f;margin:0;text-align:center\">Нажимая кнопку, вы соглашаетесь с обработкой персональных данных.</p>\n          </form>\n        </sc-if>\n      </div>\n    </div>\n  </section>\n\n  <!-- ================= ЧАСТЫЕ ВОПРОСЫ ================= -->\n  <section id=\"faq\" style=\"background:#fdfbf7;padding:clamp(54px,8vw,96px) 22px;scroll-margin-top:74px\">\n    <div style=\"max-width:820px;margin:0 auto\">\n      <div style=\"max-width:660px;margin:0 0 clamp(24px,3vw,36px)\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:26px;height:1px;background:#bd9a5c\"></span><span style=\"font:600 12px 'Manrope',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#a9803f\">Частые вопросы</span></div>\n        <h2 style=\"font:600 clamp(26px,3.6vw,40px)/1.14 'Lora',serif;letter-spacing:-.01em;color:#1c2430;margin:14px 0 0\">Коротко о главном</h2>\n      </div>\n      <div>\n        <sc-for list=\"{{ faqs }}\" as=\"q\" hint-placeholder-count=\"8\">\n          <div style=\"border-bottom:1px solid rgba(23,33,46,.1)\">\n            <button type=\"button\" onclick=\"{{ q.toggle }}\" aria-expanded=\"{{ q.open }}\" style=\"width:100%;text-align:left;background:none;border:none;padding:20px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;cursor:pointer\">\n              <span style=\"font:600 16px 'Manrope',sans-serif;color:#1c2430\">{{ q.q }}</span>\n              <span style=\"flex:none;color:#bd9a5c;font:400 22px 'Manrope',sans-serif;line-height:1\">{{ q.sign }}</span>\n            </button>\n            <sc-if value=\"{{ q.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font:400 14.5px/1.6 'Manrope',sans-serif;color:#5a6472;margin:0;padding:0 0 20px;max-width:680px\">{{ q.a }}</p>\n            </sc-if>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n  </section>\n\n  <!-- ================= ПОЛЕЗНЫЕ СТАТЬИ ================= -->\n  <sc-if value=\"{{ showArticles }}\" hint-placeholder-val=\"{{ true }}\">\n  <section id=\"articles\" style=\"background:#f4efe6;padding:clamp(54px,8vw,96px) 22px;scroll-margin-top:74px\">\n    <div style=\"max-width:1160px;margin:0 auto\">\n      <div style=\"max-width:660px;margin:0 0 clamp(28px,4vw,44px)\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:26px;height:1px;background:#bd9a5c\"></span><span style=\"font:600 12px 'Manrope',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#a9803f\">Полезное</span></div>\n        <h2 style=\"font:600 clamp(26px,3.6vw,40px)/1.14 'Lora',serif;letter-spacing:-.01em;color:#1c2430;margin:14px 0 0\">Статьи и разъяснения</h2>\n        <p style=\"font:400 clamp(15px,1.8vw,17px)/1.6 'Manrope',sans-serif;color:#5a6472;margin:14px 0 0\">Короткие материалы, которые помогут подготовиться к обращению.</p>\n      </div>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px\">\n        <sc-for list=\"{{ articles }}\" as=\"a\" hint-placeholder-count=\"6\">\n          <a href=\"#form\" style=\"display:block;background:#fff;border:1px solid rgba(23,33,46,.09);border-radius:14px;overflow:hidden\" style-hover=\"border-color:rgba(189,154,92,.6)\">\n            <div style=\"aspect-ratio:16/9;background:repeating-linear-gradient(135deg,#ece5d8 0,#ece5d8 11px,#f2ece1 11px,#f2ece1 22px);display:grid;place-items:center\"><span style=\"font:500 11px ui-monospace,Menlo,monospace;color:#9a8f7d\">изображение</span></div>\n            <div style=\"padding:20px 22px\">\n              <h3 style=\"font:600 17px/1.3 'Manrope',sans-serif;color:#1c2430;margin:0 0 8px\">{{ a.t }}</h3>\n              <p style=\"font:400 13.5px/1.55 'Manrope',sans-serif;color:#5a6472;margin:0 0 12px\">{{ a.d }}</p>\n              <span style=\"font:600 13px 'Manrope',sans-serif;color:#8a6d3b\">Читать →</span>\n            </div>\n          </a>\n        </sc-for>\n      </div>\n    </div>\n  </section>\n  </sc-if>\n\n  <!-- ================= ФИНАЛЬНЫЙ CTA ================= -->\n  <section style=\"background:#111925;color:#eef1f5;padding:clamp(56px,8vw,104px) 22px\">\n    <div style=\"max-width:760px;margin:0 auto;text-align:center\">\n      <h2 style=\"font:600 clamp(28px,4.4vw,44px)/1.14 'Lora',serif;letter-spacing:-.01em;color:#fbfaf7;margin:0\">Нужна консультация адвоката?</h2>\n      <p style=\"font:400 clamp(16px,2vw,18px)/1.6 'Manrope',sans-serif;color:#aab6c3;margin:18px auto 28px;max-width:560px\">Опишите ситуацию, и я подберу удобный формат консультации — очно в Абакане или дистанционно по всей Хакасии.</p>\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:12px\">\n        <a href=\"#form\" style=\"padding:16px 26px;border-radius:10px;background:#bd9a5c;color:#161d27;font:600 15px 'Manrope',sans-serif\" style-hover=\"background:#caa869\">Записаться на консультацию</a>\n        <a href=\"tel:{{ c.phoneHref }}\" style=\"padding:16px 24px;border-radius:10px;border:1px solid rgba(255,255,255,.26);color:#f4f1ea;font:600 15px 'Manrope',sans-serif\" style-hover=\"border-color:#c8a763\">Позвонить</a>\n        <a href=\"{{ c.tgUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"padding:16px 24px;border-radius:10px;border:1px solid rgba(255,255,255,.26);color:#f4f1ea;font:600 15px 'Manrope',sans-serif\" style-hover=\"border-color:#c8a763\">Написать в Telegram</a>\n      </div>\n    </div>\n  </section>\n</main>\n\n<!-- ================= ПОДВАЛ ================= -->\n<footer style=\"background:#0d141d;color:#c7cfda;padding:clamp(44px,6vw,68px) 22px 28px\">\n  <div style=\"max-width:1160px;margin:0 auto;display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between\">\n    <div style=\"flex:1 1 280px;min-width:min(100%,260px)\">\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        <span style=\"width:42px;height:42px;border-radius:9px;border:1px solid rgba(189,154,92,.6);display:grid;place-items:center;color:#c8a763;font:600 15px 'Lora',serif\">{{ c.monogram }}</span>\n        <span style=\"display:flex;flex-direction:column;line-height:1.15\"><span style=\"color:#f4f1ea;font:600 15px 'Manrope',sans-serif\">{{ c.name }}</span><span style=\"color:#c8a763;font:500 11px 'Manrope',sans-serif;letter-spacing:.16em;text-transform:uppercase\">{{ c.role }} · Хакасия</span></span>\n      </div>\n      <p style=\"font:400 13.5px/1.6 'Manrope',sans-serif;color:#8b97a6;margin:16px 0 0;max-width:300px\">Адвокатская помощь по уголовным, семейным, наследственным и гражданским делам в Республике Хакасия.</p>\n    </div>\n    <div style=\"flex:0 1 auto\">\n      <h3 style=\"font:600 12px 'Manrope',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8b97a6;margin:0 0 14px\">Разделы</h3>\n      <div style=\"display:flex;flex-direction:column;gap:9px\">\n        <a href=\"#services\" style=\"color:#c7cfda;font:500 14px 'Manrope',sans-serif\" style-hover=\"color:#fff\">Услуги</a>\n        <a href=\"#about\" style=\"color:#c7cfda;font:500 14px 'Manrope',sans-serif\" style-hover=\"color:#fff\">О специалисте</a>\n        <a href=\"#faq\" style=\"color:#c7cfda;font:500 14px 'Manrope',sans-serif\" style-hover=\"color:#fff\">Вопросы</a>\n        <a href=\"#contacts\" style=\"color:#c7cfda;font:500 14px 'Manrope',sans-serif\" style-hover=\"color:#fff\">Контакты</a>\n      </div>\n    </div>\n    <div style=\"flex:0 1 auto\">\n      <h3 style=\"font:600 12px 'Manrope',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8b97a6;margin:0 0 14px\">Связь</h3>\n      <div style=\"display:flex;flex-direction:column;gap:9px\">\n        <a href=\"tel:{{ c.phoneHref }}\" style=\"color:#c7cfda;font:500 14px 'Manrope',sans-serif\" style-hover=\"color:#fff\">{{ c.phoneDisplay }}</a>\n        <a href=\"{{ c.tgUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"color:#c7cfda;font:500 14px 'Manrope',sans-serif\" style-hover=\"color:#fff\">Telegram {{ c.tgHandle }}</a>\n        <a href=\"mailto:{{ c.email }}\" style=\"color:#c7cfda;font:500 14px 'Manrope',sans-serif\" style-hover=\"color:#fff\">{{ c.email }}</a>\n      </div>\n    </div>\n  </div>\n  <div style=\"max-width:1160px;margin:32px auto 0;padding-top:22px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center\">\n    <p style=\"font:400 12.5px/1.6 'Manrope',sans-serif;color:#7f8b9a;margin:0;max-width:640px\">Информация на сайте носит справочный характер, не является публичной офертой и не гарантирует исход дела. Каждая ситуация рассматривается индивидуально.</p>\n    <div style=\"display:flex;gap:18px;align-items:center\">\n      <button type=\"button\" onclick=\"{{ openPrivacy }}\" style=\"padding:0;border:0;background:transparent;color:#c7cfda;font:500 12.5px 'Manrope',sans-serif;cursor:pointer\" style-hover=\"color:#fff\">Политика конфиденциальности</button>\n      <span style=\"font:400 12.5px 'Manrope',sans-serif;color:#5f6b7a\">© 2026</span>\n    </div>\n  </div>\n</footer>\n\n<!-- ================= МОДАЛЬНОЕ ОКНО ДОКУМЕНТА ================= -->\n<sc-if value=\"{{ hasLightbox }}\" hint-placeholder-val=\"{{ false }}\">\n  <div role=\"dialog\" aria-modal=\"true\" aria-label=\"Просмотр документа\" onclick=\"{{ closeLightbox }}\" style=\"position:fixed;inset:0;z-index:90;background:rgba(8,11,16,.84);display:grid;place-items:center;padding:22px\">\n    <div onclick=\"{{ stop }}\" style=\"max-width:520px;width:100%;background:#141c27;border-radius:16px;padding:16px 16px 20px\">\n      <div style=\"display:flex;justify-content:flex-end;margin-bottom:6px\">\n        <button type=\"button\" aria-label=\"Закрыть\" onclick=\"{{ closeLightbox }}\" style=\"width:38px;height:38px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#f4f1ea;font-size:18px;cursor:pointer\">✕</button>\n      </div>\n      <div role=\"img\" aria-label=\"{{ lightboxItem.cap }}\" style=\"aspect-ratio:3/4;border-radius:10px;background:repeating-linear-gradient(135deg,#1b2532 0,#1b2532 12px,#212d3c 12px,#212d3c 24px);display:grid;place-items:center\">\n        <span style=\"font:500 12px/1.7 ui-monospace,Menlo,monospace;color:#8fa0b4;text-align:center;padding:0 24px\">{{ lightboxItem.cap }}<br>ЗАМЕНИТЬ изображением документа</span>\n      </div>\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px\">\n        <button type=\"button\" onclick=\"{{ prevLightbox }}\" style=\"padding:11px 16px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#f4f1ea;font:600 13px 'Manrope',sans-serif;cursor:pointer\">← Назад</button>\n        <span style=\"font:600 13.5px 'Manrope',sans-serif;color:#e7ebf1;text-align:center\">{{ lightboxItem.cap }}</span>\n        <button type=\"button\" onclick=\"{{ nextLightbox }}\" style=\"padding:11px 16px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#f4f1ea;font:600 13px 'Manrope',sans-serif;cursor:pointer\">Далее →</button>\n      </div>\n    </div>\n  </div>\n</sc-if>\n\n<!-- ================= МОДАЛЬНОЕ ОКНО: ПОЛИТИКА КОНФИДЕНЦИАЛЬНОСТИ ================= -->\n<sc-if value=\"{{ privacyOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div role=\"dialog\" aria-modal=\"true\" aria-label=\"Политика конфиденциальности\" onclick=\"{{ closePrivacy }}\" style=\"position:fixed;inset:0;z-index:90;background:rgba(8,11,16,.72);display:grid;place-items:center;padding:22px\">\n    <div onclick=\"{{ stop }}\" style=\"max-width:640px;width:100%;max-height:84vh;overflow-y:auto;background:#fdfbf7;border-radius:16px;padding:clamp(24px,4vw,36px)\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:6px\">\n        <h2 style=\"font:600 clamp(21px,3vw,28px) 'Lora',serif;color:#1c2430;margin:0\">Политика конфиденциальности</h2>\n        <button type=\"button\" aria-label=\"Закрыть\" onclick=\"{{ closePrivacy }}\" style=\"flex:none;width:38px;height:38px;border-radius:9px;border:1px solid rgba(23,33,46,.16);background:transparent;color:#1c2430;font-size:18px;cursor:pointer\">✕</button>\n      </div>\n      <p style=\"font:400 14px/1.65 'Manrope',sans-serif;color:#5a6472\">Настоящая политика описывает порядок обработки персональных данных, которые вы оставляете через форму на сайте. Отправляя заявку, вы даёте согласие на обработку указанных данных.</p>\n      <h3 style=\"font:600 16px 'Manrope',sans-serif;color:#1c2430;margin:18px 0 6px\">1. Какие данные обрабатываются</h3>\n      <p style=\"font:400 14px/1.65 'Manrope',sans-serif;color:#5a6472;margin:0\">Имя, номер телефона, адрес электронной почты и краткое описание ситуации, которые вы указываете добровольно.</p>\n      <h3 style=\"font:600 16px 'Manrope',sans-serif;color:#1c2430;margin:18px 0 6px\">2. Цель обработки</h3>\n      <p style=\"font:400 14px/1.65 'Manrope',sans-serif;color:#5a6472;margin:0\">Связь с вами по вашему обращению, согласование формата и времени консультации.</p>\n      <h3 style=\"font:600 16px 'Manrope',sans-serif;color:#1c2430;margin:18px 0 6px\">3. Конфиденциальность</h3>\n      <p style=\"font:400 14px/1.65 'Manrope',sans-serif;color:#5a6472;margin:0\">Данные не передаются третьим лицам, за исключением случаев, предусмотренных законодательством. Обращения рассматриваются конфиденциально.</p>\n      <h3 style=\"font:600 16px 'Manrope',sans-serif;color:#1c2430;margin:18px 0 6px\">4. Ваши права</h3>\n      <p style=\"font:400 14px/1.65 'Manrope',sans-serif;color:#5a6472;margin:0\">Вы можете отозвать согласие на обработку персональных данных, обратившись по указанным на сайте контактам.</p>\n      <p style=\"font:400 12.5px/1.6 'Manrope',sans-serif;color:#8a939f;margin:22px 0 0\">Оператор персональных данных: [указать ФИО адвоката / реквизиты]. Контакты для обращений: {{ c.email }}. Текст политики приведён как образец — замените на актуальную редакцию.</p>\n      <button type=\"button\" onclick=\"{{ closePrivacy }}\" style=\"margin-top:22px;padding:13px 22px;border-radius:10px;background:#bd9a5c;color:#161d27;font:600 14px 'Manrope',sans-serif;border:none;cursor:pointer\">Понятно</button>\n    </div>\n  </div>\n</sc-if>\n\n  <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n    <div role=\"status\" aria-live=\"polite\" style=\"position:fixed;right:22px;bottom:22px;z-index:90;display:flex;align-items:center;gap:12px;max-width:min(380px,calc(100vw - 44px));padding:16px 18px;border:1px solid rgba(189,154,92,.55);border-radius:12px;background:#1c2430;color:#f4f1ea;box-shadow:0 22px 50px rgba(0,0,0,.35)\">\n      <span aria-hidden=\"true\" style=\"width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:50%;background:#bd9a5c;color:#161d27;font:700 16px 'Manrope',sans-serif\">✓</span>\n      <span style=\"font:600 15px 'Manrope',sans-serif\">Письмо отправлено</span>\n    </div>\n  </sc-if>\n\n<!-- ================= ПЛАВАЮЩИЕ КНОПКИ (МОБИЛЬНЫЕ) ================= -->\n<sc-if value=\"{{ mobileBar }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;left:0;right:0;bottom:0;z-index:55;display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(17,24,34,.96);backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.1)\">\n    <a href=\"tel:{{ c.phoneHref }}\" style=\"flex:1;text-align:center;padding:14px;border-radius:10px;background:#bd9a5c;color:#161d27;font:600 15px 'Manrope',sans-serif\">Позвонить</a>\n    <a href=\"{{ c.tgUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"flex:1;text-align:center;padding:14px; ript>\n\n\n</body></html>"
